services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4173
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY}
      TENCENT_SES_FROM_EMAIL: ${TENCENT_SES_FROM_EMAIL:-}
      TENCENT_SES_TEMPLATE_ID: ${TENCENT_SES_TEMPLATE_ID:-}
      TENCENT_SES_REGION: ${TENCENT_SES_REGION:-ap-guangzhou}
      TENCENT_SES_SUBJECT: ${TENCENT_SES_SUBJECT:-JobPilot CN 注册验证码}
      TENCENT_SES_REPLY_TO: ${TENCENT_SES_REPLY_TO:-}
      EMAIL_CODE_MINUTES: ${EMAIL_CODE_MINUTES:-5}
      TENCENT_SMS_SDK_APP_ID: ${TENCENT_SMS_SDK_APP_ID}
      TENCENT_SMS_SIGN_NAME: ${TENCENT_SMS_SIGN_NAME}
      TENCENT_SMS_TEMPLATE_ID: ${TENCENT_SMS_TEMPLATE_ID}
      TENCENT_SMS_REGION: ${TENCENT_SMS_REGION:-ap-guangzhou}
      SMS_CODE_MINUTES: ${SMS_CODE_MINUTES:-5}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_WEBHOOK_TOKEN: ${SMS_WEBHOOK_TOKEN:-}
    expose:
      - "4173"
    volumes:
      - jobpilot_data:/app/data
      - jobpilot_generated:/app/generated
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  jobpilot_data:
  jobpilot_generated:
  caddy_data:
  caddy_config:
